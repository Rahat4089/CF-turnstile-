<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turnstile Inspector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Turnstile Inspector</h1>
        <p>Captured values for current tab</p>
      </header>

      <section class="actions">
        <button id="refreshBtn" type="button">Refresh</button>
        <button id="copyBtn" type="button">Copy Latest JSON</button>
      </section>

      <section id="status" class="status">Waiting for captures...</section>
      <section id="list" class="list"></section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
